<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZEE STORE - Admin Token Manager</title>
    <meta name="theme-color" content="#030712">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: #030712;
            color: #ffffff;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
        }

        /* HEADER */
        .header {
            background: rgba(3, 15, 30, 0.9);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(0, 240, 255, 0.3);
            padding: 20px;
            border-radius: 15px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 20px;
            box-shadow: 0 5px 20px rgba(0, 240, 255, 0.15);
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 22px;
            font-weight: bold;
            color: #00f0ff;
            text-shadow: 0 0 10px rgba(0, 240, 255, 0.5);
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .logo-icon {
            display: inline-block;
            animation: spin 3s linear infinite;
        }

        /* CARD PANEL */
        .panel {
            background: rgba(3, 15, 30, 0.85);
            border: 1px solid rgba(0, 240, 255, 0.3);
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 0 15px rgba(0, 240, 255, 0.1);
        }

        .panel h3 {
            color: #00f0ff;
            margin-bottom: 15px;
            font-size: 18px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr auto;
            gap: 12px;
        }

        @media(max-width: 768px) {
            .form-grid {
                grid-template-columns: 1fr;
            }
        }

        input, select {
            width: 100%;
            padding: 12px;
            background: rgba(3, 7, 18, 0.9);
            border: 1px solid rgba(0, 240, 255, 0.4);
            border-radius: 8px;
            color: white;
            font-size: 14px;
            outline: none;
        }

        input:focus, select:focus {
            border-color: #00f0ff;
            box-shadow: 0 0 10px rgba(0, 240, 255, 0.4);
        }

        .btn {
            background: rgba(0, 240, 255, 0.2);
            border: 1px solid #00f0ff;
            color: white;
            padding: 12px 20px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn:hover {
            background: rgba(0, 240, 255, 0.5);
            box-shadow: 0 0 15px rgba(0, 240, 255, 0.7);
        }

        .btn-danger {
            background: rgba(255, 0, 0, 0.2);
            border-color: #ff4444;
            color: #ff4444;
            padding: 6px 12px;
            font-size: 12px;
        }
        .btn-danger:hover {
            background: rgba(255, 0, 0, 0.5);
            box-shadow: 0 0 10px rgba(255, 68, 68, 0.6);
            color: white;
        }

        .btn-edit {
            background: rgba(255, 193, 7, 0.2);
            border-color: #ffc107;
            color: #ffc107;
            padding: 6px 12px;
            font-size: 12px;
        }
        .btn-edit:hover {
            background: rgba(255, 193, 7, 0.5);
            box-shadow: 0 0 10px rgba(255, 193, 7, 0.6);
            color: white;
        }

        /* TABLE */
        .table-container {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
            margin-top: 10px;
        }

        th, td {
            padding: 12px;
            border-bottom: 1px solid rgba(0, 240, 255, 0.2);
            font-size: 14px;
        }

        th {
            color: #00f0ff;
            background: rgba(0, 240, 255, 0.05);
        }

        .badge {
            padding: 4px 8px;
            border-radius: 6px;
            font-size: 11px;
            font-weight: bold;
        }
        .badge.premium {
            background: rgba(0, 240, 255, 0.2);
            border: 1px solid #00f0ff;
            color: #00f0ff;
        }
        .badge.free {
            background: rgba(176, 196, 222, 0.15);
            border: 1px solid #b0c4de;
            color: #b0c4de;
        }

        /* NOTIFICATION TOAST */
        #toast {
            visibility: hidden;
            min-width: 250px;
            background-color: #00f0ff;
            color: #030712;
            text-align: center;
            border-radius: 8px;
            padding: 12px;
            position: fixed;
            z-index: 9999;
            left: 50%;
            bottom: 30px;
            transform: translateX(-50%);
            font-weight: bold;
            box-shadow: 0 0 20px rgba(0, 240, 255, 0.8);
        }
        #toast.show {
            visibility: visible;
            animation: fadeInOut 2.5s;
        }
        @keyframes fadeInOut {
            0% { opacity: 0; bottom: 10px; }
            20% { opacity: 1; bottom: 30px; }
            80% { opacity: 1; bottom: 30px; }
            100% { opacity: 0; bottom: 10px; }
        }
    </style>
</head>
<body>

<div class="container">
    <!-- HEADER -->
    <header class="header">
        <div class="logo">
            <span class="logo-icon">☣️</span>
            ZEE STORE - ADMIN TOKEN
        </div>
        <div id="connectionStatus" style="font-size: 12px; color: #00f0ff;">Menghubungkan...</div>
    </header>

    <!-- FORM TAMBAH / UPDATE TOKEN -->
    <div class="panel">
        <h3 id="formTitle">➕ Tambah / Perbarui Token</h3>
        <div class="form-grid">
            <input type="text" id="tokenInput" placeholder="Nama Token (Contoh: ZEE_P04X)">
            <select id="statusInput">
                <option value="premium">Premium</option>
                <option value="free">Free</option>
            </select>
            <input type="date" id="expiredInput">
            <button class="btn" onclick="saveToken()">Simpan Token</button>
        </div>
    </div>

    <!-- DAFTAR TOKEN -->
    <div class="panel">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
            <h3 style="margin: 0;">📋 Daftar Token Aktif</h3>
            <input type="text" id="searchInput" placeholder="🔍 Cari token..." onkeyup="filterTable()" style="max-width: 220px; padding: 8px 12px;">
        </div>
        <div class="table-container">
            <table id="tokenTable">
                <thead>
                    <tr>
                        <th>Token</th>
                        <th>Status</th>
                        <th>Expired</th>
                        <th style="text-align: center;">Aksi</th>
                    </tr>
                </thead>
                <tbody id="tokenTableBody">
                    <tr><td colspan="4" style="text-align: center; color: #b0c4de;">Memuat data dari database...</td></tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<div id="toast">Berhasil disimpan!</div>

<script>
    const FIREBASE_URL = "https://token-pengguna-default-rtdb.asia-southeast1.firebasedatabase.app/tokens";
    let allTokens = {};

    function showToast(message) {
        const toast = document.getElementById("toast");
        toast.textContent = message;
        toast.className = "show";
        setTimeout(() => { toast.className = toast.className.replace("show", ""); }, 2500);
    }

    // Ambil Data dari Firebase
    async function fetchTokens() {
        try {
            const response = await fetch(`${FIREBASE_URL}.json`);
            const data = await response.json();
            allTokens = data || {};
            renderTable(allTokens);
            document.getElementById("connectionStatus").textContent = "● Terhubung ke DB";
            document.getElementById("connectionStatus").style.color = "#25D366";
        } catch (error) {
            console.error("Gagal memuat:", error);
            document.getElementById("connectionStatus").textContent = "● Gagal Koneksi";
            document.getElementById("connectionStatus").style.color = "#ff4444";
        }
    }

    // Tampilkan Data ke Tabel
    function renderTable(tokens) {
        const tbody = document.getElementById("tokenTableBody");
        tbody.innerHTML = "";

        const keys = Object.keys(tokens);
        if (keys.length === 0) {
            tbody.innerHTML = `<tr><td colspan="4" style="text-align: center; color: #b0c4de;">Belum ada token tersimpan.</td></tr>`;
            return;
        }

        keys.forEach(tokenName => {
            const item = tokens[tokenName];
            const tr = document.createElement("tr");
            tr.innerHTML = `
                <td style="font-weight: bold; color: #00f0ff;">${tokenName}</td>
                <td><span class="badge ${item.status}">${item.status.toUpperCase()}</span></td>
                <td>${item.expired}</td>
                <td style="text-align: center; display: flex; gap: 6px; justify-content: center;">
                    <button class="btn btn-edit" onclick="editToken('${tokenName}', '${item.status}', '${item.expired}')">Edit</button>
                    <button class="btn btn-danger" onclick="deleteToken('${tokenName}')">Hapus</button>
                </td>
            `;
            tbody.appendChild(tr);
        });
    }

    // Ambil Data dari Firebase dan Cek Token Expired Otomatis
    async function fetchTokens() {
        try {
            const response = await fetch(`${FIREBASE_URL}.json`);
            const data = await response.json();
            
            if (!data) {
                allTokens = {};
                renderTable(allTokens);
                document.getElementById("connectionStatus").textContent = "● Terhubung ke DB";
                document.getElementById("connectionStatus").style.color = "#25D366";
                return;
            }

            // Dapatkan tanggal hari ini dengan format YYYY-MM-DD
            const today = new Date().toISOString().split('T')[0];
            let hasExpired = false;

            // Periksa setiap token apakah sudah expired
            for (const tokenName in data) {
                const item = data[tokenName];
                if (item.expired && item.expired < today) {
                    // Jika expired lebih kecil dari hari ini, hapus otomatis dari Firebase
                    await fetch(`${FIREBASE_URL}/${tokenName}.json`, {
                        method: 'DELETE'
                    });
                    delete data[tokenName]; // Hapus dari memori lokal
                    hasExpired = true;
                }
            }

            // Jika ada token yang terhapus otomatis, tampilkan pemberitahuan
            if (hasExpired) {
                showToast("Token yang kedaluwarsa telah dihapus otomatis.");
            }

            allTokens = data;
            renderTable(allTokens);
            document.getElementById("connectionStatus").textContent = "● Terhubung ke DB";
            document.getElementById("connectionStatus").style.color = "#25D366";
        } catch (error) {
            console.error("Gagal memuat:", error);
            document.getElementById("connectionStatus").textContent = "● Gagal Koneksi";
            document.getElementById("connectionStatus").style.color = "#ff4444";
        }
    }


    // Isi form untuk mode Edit
    function editToken(name, status, expired) {
        document.getElementById("tokenInput").value = name;
        document.getElementById("tokenInput").disabled = true; // Kunci nama token agar tidak berubah, gunakan PUT untuk update data
        document.getElementById("statusInput").value = status;
        document.getElementById("expiredInput").value = expired;
        document.getElementById("formTitle").textContent = `✏️ Edit Token: ${name} (Buka Kunci dengan Hapus jika ingin ganti nama)`;
        window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    // Hapus Token dari Firebase
    async function deleteToken(tokenName) {
        if (!confirm(`Apakah Anda yakin ingin menghapus token "${tokenName}"?`)) return;

        try {
            const response = await fetch(`${FIREBASE_URL}/${tokenName}.json`, {
                method: 'DELETE'
            });

            if (response.ok) {
                showToast(`Token "${tokenName}" berhasil dihapus!`);
                fetchTokens();
            } else {
                alert("Gagal menghapus token.");
            }
        } catch (error) {
            console.error("Error:", error);
            alert("Terjadi kesalahan jaringan.");
        }
    }

    // Filter Pencarian Tabel Real-Time
    function filterTable() {
        const query = document.getElementById("searchInput").value.toLowerCase();
        let filtered = {};
        Object.keys(allTokens).forEach(key => {
            if (key.toLowerCase().includes(query)) {
                filtered[key] = allTokens[key];
            }
        });
        renderTable(filtered);
    }

    // Muat data saat halaman dibuka
    window.onload = fetchTokens;
</script>

</body>
</html>
